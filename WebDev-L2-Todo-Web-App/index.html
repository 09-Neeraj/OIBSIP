<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple and responsive To-Do Web App"
    >

    <title>My To-Do List</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>My To-Do List</h1>

        <p>Make Progress Every Day</p>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="todo-container">

        <!-- Add Task -->

        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                autocomplete="off"
            >

            <button id="addTaskBtn">
                Add
            </button>

        </section>


        <!-- Filters -->

        <section class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </section>


        <!-- Task List -->

        <section class="task-section">

            <ul id="taskList">

                <!-- Tasks will be added using JavaScript -->

            </ul>

            <!-- Empty Message -->

            <p
                id="emptyMessage"
                class="empty-message"
            >
                No tasks yet. Add your first task!
            </p>

        </section>


        <!-- Task Footer -->

        <section class="task-footer">

            <p id="taskCount">
                0 tasks left
            </p>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Stay Focused. Stay Productive. 🌿
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
